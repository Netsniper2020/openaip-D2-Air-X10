# Compile l'app Connect IQ via connect-iq-sdk-manager-cli
# Secrets GitHub requis :
#   GARMIN_USERNAME : email du compte Garmin developer
#   GARMIN_PASSWORD : mot de passe Garmin

name: Build Connect IQ

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install connect-iq-sdk-manager-cli
        run: |
          curl -s https://raw.githubusercontent.com/lindell/connect-iq-sdk-manager-cli/master/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Accept license & login
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          connect-iq-sdk-manager agreement accept
          connect-iq-sdk-manager login

      - name: Install SDK
        run: |
          connect-iq-sdk-manager sdk set 9.2.0
          echo "$(connect-iq-sdk-manager sdk current-path --bin)" >> $GITHUB_PATH

      - name: Download device files
        run: |
          connect-iq-sdk-manager device download --manifest=manifest.xml

      - name: Generate developer key
        run: |
          openssl genrsa -out /tmp/key.pem 4096
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in /tmp/key.pem -out /tmp/developer_key.der -nocrypt

      - name: Compile PRG
        run: |
          mkdir -p bin
          monkeyc \
            -d d2airx10 \
            -f monkey.jungle \
            -o bin/OpenAipMap.prg \
            -y /tmp/developer_key.der \
            -w

      - name: Package IQ (store)
        continue-on-error: true
        run: |
          monkeyc -e \
            -o bin/OpenAipMap.iq \
            -f monkey.jungle \
            -y /tmp/developer_key.der -w

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openaip-map-d2airx10
          path: bin/
          retention-days: 30
